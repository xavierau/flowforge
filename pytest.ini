[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=app --cov-report=term-missing --cov-report=html --cov-config=.coveragerc
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow-running tests
asyncio_mode = auto
