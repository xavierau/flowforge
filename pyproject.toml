[project]
name = "ai-document-processing"
version = "0.1.0"
description = "AI-powered document processing SaaS with VLLM"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]==3.2.3",
    "celery[redis]",
    "redis",
    "pydantic",
    "pydantic-settings",
    "python-multipart>=0.0.9",
    "pdf2image==1.16.3",
    "pillow>=11.0.0",
    "boto3",
    "dspy-ai",
    "cloudpickle>=3.0.0",
    "openai",
    "google-genai",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "jsonschema==4.20.0",
    "notebook>=7.4.7",
    "starlette>=0.27.0",
    "anyio>=3.7.1",
    "fastmcp",
    "mem0ai>=1.0.0",
    "psycopg2-binary>=2.9.11",
    "opencv-python-headless>=4.12.0.88",
    "torch>=2.9.1",
    "unstructured-client>=0.42.4",
    "transformers>=4.57.1",
    "accelerate>=1.12.0",
    "jsonpath-ng>=1.7.0",
    "cryptography>=42.0.0",
    "aiosmtplib>=3.0.0",
    "conductor-python>=1.0.0",
    "slowapi>=0.1.9",
    "sendgrid>=6.12.5",
    "pdfplumber>=0.11.8",
    "matplotlib>=3.10.8",
    "pytesseract>=0.3.13",
    "asyncer>=0.0.12",
    "mail-parser>=4.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx>=0.26.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing"
filterwarnings = [
    # Ignore deprecation warnings from third-party packages we can't control
    "ignore::pydantic.PydanticDeprecatedSince20:litellm.*",
    "ignore::pydantic.PydanticDeprecatedSince212:google.genai.*",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:importlib_resources.*",
    # Convert our own deprecation warnings to errors so we catch them early
    "error::DeprecationWarning:app.*",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
